<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description"
		content="Design showcase: Movement 01 - a generated instrument. Cut wheels on real ratios, an engine-turned plate, a hand-wound coil; hover any part to name it." />
	<link rel="canonical" href="https://yondertech.co.nz/cases/library/movement/index.html" />
	<link rel="icon" href="../../../assets/favicon.svg" type="image/svg+xml" />
	<meta name="theme-color" content="#e7e3da" />
	<meta property="og:type" content="website" />
	<meta property="og:title" content="Movement 01 - Live concept" />
	<meta property="og:description"
		content="A generated instrument: cut wheels on real ratios, an engine-turned plate, a hand-wound coil." />
	<meta property="og:url" content="https://yondertech.co.nz/cases/library/movement/index.html" />
	<meta property="og:site_name" content="Yonder Tech" />
	<title>Movement 01 - Live concept</title>
	<link rel="stylesheet" href="assets/styles.css" />
</head>

<body class="plate">
	<div id="stage"></div>

	<svg id="leader" aria-hidden="true"></svg>
	<div id="tag"></div>

	<div class="hud">
		<div class="row">
			<div class="hud-nav">
				<a href="../../index.html" target="_top">Yonder Case Library</a>
				<a href="project.html">Case study</a>
			</div>
			<ol class="index-list" id="index-list"></ol>
		</div>

		<div class="row"></div>

		<div class="row bottom">
			<div>
				<h1 class="title">Movement 01</h1>
				<p class="lede">
					An instrument assembled at load: cut wheels turning on their real ratios, a rosette engraved
					into the plate, a coil somebody wound. Drag to turn it, hover to name a part.
				</p>
			</div>
			<dl class="caliber" id="caliber"></dl>
		</div>
	</div>

	<div class="mark tl"></div>
	<div class="mark tr"></div>
	<div class="mark bl"></div>
	<div class="mark br"></div>

	<div id="fallback"><p>This study needs WebGL 2. Try a current desktop browser.</p></div>

	<script type="importmap">
		{
			"imports": {
				"three": "../../../assets/vendor/three/three.module.min.js",
				"three/addons/": "../../../assets/vendor/three/addons/"
			}
		}
	</script>

	<script type="module">
		import { createMovement } from "./movement.js";

		const stage = document.getElementById("stage");
		let api;

		try {
			api = createMovement(stage);
		} catch (error) {
			console.error(error);
			document.getElementById("fallback").style.display = "grid";
		}

		if (api) {
			/* The calibre block is read off the running scene, so the tooth
			   counts on the page cannot drift from the ones being turned. */
			const { greatTeeth, pinionTeeth } = api.config.train;
			const jewels = api.parts.filter((p) => p.userData.part.name === "Jewel").length;
			const caliber = document.getElementById("caliber");
			for (const [term, value] of [
				["Great wheel", `${greatTeeth} t`],
				["Pinions", `${pinionTeeth} t · ${(greatTeeth / pinionTeeth).toFixed(2)}:1`],
				["Jewels", String(jewels)],
				["Assets loaded", "0"],
			]) {
				const row = document.createElement("div");
				const dt = document.createElement("dt");
				const dd = document.createElement("dd");
				dt.textContent = term;
				dd.textContent = value;
				row.append(dt, dd);
				caliber.append(row);
			}

			/* The index lists every named part once, in the order it was built,
			   and marks the row the pointer is on — the drawing and its key are
			   the same document. */
			const listed = [];
			for (const part of api.parts) {
				const { name } = part.userData.part;
				if (!listed.includes(name)) listed.push(name);
			}

			const list = document.getElementById("index-list");
			const rows = new Map();
			listed.forEach((name, i) => {
				const li = document.createElement("li");
				const label = document.createElement("span");
				const num = document.createElement("b");
				label.textContent = name;
				num.textContent = String(i + 1).padStart(2, "0");
				li.append(label, num);
				list.append(li);
				rows.set(name, li);
			});

			const tag = document.getElementById("tag");
			const leader = document.getElementById("leader");
			const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
			const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
			dot.setAttribute("r", "3");
			leader.append(line, dot);
			let current = null;

			api.onPart((part) => {
				for (const li of rows.values()) li.classList.remove("is-on");
				current = part;
				if (!part) {
					tag.classList.remove("is-on");
					line.setAttribute("stroke-opacity", "0");
					dot.setAttribute("stroke-opacity", "0");
					return;
				}
				rows.get(part.name)?.classList.add("is-on");
				tag.innerHTML = "";
				tag.append(part.name);
				if (part.note) {
					const em = document.createElement("em");
					em.textContent = part.note;
					tag.append(em);
				}
				tag.classList.add("is-on");
				line.setAttribute("stroke-opacity", "1");
				dot.setAttribute("stroke-opacity", "1");
			});

			api.onPartMove((ndc) => {
				if (!current) return;
				const x = (ndc.x * 0.5 + 0.5) * window.innerWidth;
				const y = (-ndc.y * 0.5 + 0.5) * window.innerHeight;
				/* The label sits out at a fixed offset and the leader reaches
				   back to the part, the way a callout is drawn on a plan. */
				const side = x > window.innerWidth * 0.55 ? -1 : 1;
				const tagX = x + side * 92;
				const tagY = y - 58;
				tag.style.left = `${side > 0 ? tagX : tagX - tag.offsetWidth}px`;
				tag.style.top = `${tagY}px`;
				line.setAttribute("x1", x);
				line.setAttribute("y1", y);
				line.setAttribute("x2", tagX);
				line.setAttribute("y2", tagY);
				dot.setAttribute("cx", x);
				dot.setAttribute("cy", y);
			});
		}
	</script>
</body>

</html>
